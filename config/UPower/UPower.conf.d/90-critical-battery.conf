# UPower's critical-battery action is the last safety net before a hard
# power-off. Ubuntu's default (CriticalPowerAction=HybridSleep, action at 2%)
# cannot save a session on this laptop: measured 2026-11-23, the machine began
# hibernating at 5% and the battery died while the kernel was still writing the
# 10.6 GiB image, so the next boot found no valid image and started fresh.
#
# Action at 10% leaves room to write the image and power down cleanly.
# Hibernate (not HybridSleep) is used because HibernateMode=shutdown in
# sleep.conf.d already avoids this laptop's broken ACPI S4 transition.
#
# The values are the only ones changed from the stock file; UPower's
# CriticalPowerAction overrides require AllowRiskyCriticalPowerAction for
# suspend/ignore only, so Hibernate is used without it.
[UPower]
PercentageAction=10.0
CriticalPowerAction=Hibernate
