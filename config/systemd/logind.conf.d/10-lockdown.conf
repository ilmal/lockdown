# Delegate the lid switch to logind. GNOME 50 no longer implements lid actions
# itself (gsd-power only plays a sound and locks the screen when suspend is
# inhibited), so this is the only place the lid policy lives.
#
# GNOME takes a temporary "handle-lid-switch" block inhibitor while an external
# monitor is attached; logind's Docked setting is what applies in that case, and
# "ignore" keeps the stock behaviour of staying awake on an external display.
#
# Plain SUSPEND, not suspend-then-hibernate. Measured across 13 attempts
# (2026-11-20 .. 2026-11-26) the hibernate half of suspend-then-hibernate never
# once completed on this laptop: the kernel enters "PM: hibernation: hibernation
# entry", never writes the image, never powers off, and sits in a half-frozen
# ~5 W state that looks asleep but drains ~9%/h — worse than being awake with
# the panel on. This firmware's ACPI S4 is broken (the original reason
# HibernateMode=shutdown was chosen) and the shutdown path hangs too, so there
# is no working hibernate to fall back to. s2idle is proven here: three
# consecutive 13-15 h nights on Nov 16-19 without a power loss, and every
# suspend since the NVIDIA hook was enabled on 2026-11-25 has succeeded.
#
# Idle suspend is deliberately NOT set here. GNOME's idle monitor measures
# "35 minutes since the last input" precisely; logind's IdleActionSec only
# starts counting once the session reports itself idle (at screen blank, i.e.
# 10 minutes later). The idle policy therefore lives in the two
# sleep-inactive-*-type gsettings keys, which the install script sets.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
