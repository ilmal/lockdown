# Lid closed -> suspend immediately, then hibernate after HibernateDelaySec.
# The wake is a CLOCK_BOOTTIME_ALARM timer, so a machine left shut overnight
# ends up powered off with the LUKS key gone, instead of sitting in s2idle
# draining the battery.
#
# HibernateDelaySec must be set: without it systemd waits for an ACPI
# low-battery alarm instead of a fixed delay.
[Sleep]
HibernateDelaySec=35min
HibernateOnACPower=yes
