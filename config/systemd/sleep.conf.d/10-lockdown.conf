# HibernateDelaySec is what makes the timer unconditional; without it, systemd
# waits for an ACPI low-battery alarm instead of a fixed delay.
#
# HibernateMode=shutdown replaces the default "platform" mode, which on this
# laptop fails with "Device or resource busy" at the ACPI S4 transition. In
# shutdown mode the kernel writes the image to swap and then performs a clean
# power-off instead of asking the firmware for S4. Resume still works because
# the initrd checks /sys/power/resume + resume_offset for a valid image.
[Sleep]
HibernateMode=shutdown
HibernateDelaySec=35min
